# 食材别名表 — 规范名称: [别名, ...]
#
# 作用：让「番茄」和「西红柿」被认成同一样东西。vault 用**名称**做关联键
# （见 docs/vault-format.md §1.3），没有这张表，两个写法会被算成两种食材，
# 推荐分档直接出错。
#
# 规则（docs/vault-format.md §3.6 / §4）：
#   - key 必须是库存里实际存在的规范名称
#   - value 里的每个别名全局唯一，且不得与任何规范名称重名
#   - 只收**同义词**（同一样东西的不同叫法），不收上下位关系
#     ✅ 番茄 = 西红柿      ❌ 大葱 → 葱姜蒜（上下位）
#     ✅ 芝麻油 = 香油      ❌ 花生油 → 食用油（上下位）
#   - 不做繁简转换，不做模糊匹配
#
# 这份文件是你的，随便改。加一行就多认一个叫法。

